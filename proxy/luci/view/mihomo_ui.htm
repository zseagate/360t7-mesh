<%+header%>

<%
  -- 版本号带时间戳，强制 iframe 每次拉新页面（避免缓存导致看不到新功能）
  local ver = tostring(os.time())
%>

<style type="text/css">
  /* 让本页占满 LuCI 内容区，去掉默认最大宽度与内边距 */
  .main .main-right, .main-right > .container, .cbi-map { max-width: none !important; }
  #mihomo-wrap {
    margin: -14px -18px -18px -18px;
    background: #fff;
    /* 让 iframe 精确占满标题栏以下的剩余视口 */
    height: calc(100vh - 62px);
  }
  html[data-darkmode="true"] #mihomo-wrap { background: #12151a; }
  #mihomo-frame {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 560px;
    border: 0;
  }
  @media (max-width: 900px) {
    #mihomo-wrap { height: calc(100vh - 56px); }
  }
</style>

<h2 name="content" style="display:none">代理管理</h2>

<div id="mihomo-wrap">
  <iframe id="mihomo-frame" src="/mihomo/?v=<%=ver%>" title="mihomo 代理管理"></iframe>
</div>

<%+footer%>
